name: G98 khadas Android14 build

on:
  push:
    branches:
      - master
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  ACTIONS_STEP_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        id: basic_info
        run: |
          nproc
          uname -a
          cat /etc/*release
          free -h
          mount
          df -h
          cat /proc/cpuinfo
          cat /proc/meminfo

      - name: Create simulated physical disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}"G /mnt/mnt.img
          sudo truncate -s "${root_size}"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner.runner /builder
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler zip u-boot-tools \
            python-is-python3 build-essential gcc-aarch64-linux-gnu \
            acl aptly aria2 axel bc binfmt-support binutils-aarch64-linux-gnu bison \
            bsdextrautils btrfs-progs build-essential busybox ca-certificates ccache \
            clang coreutils cpio crossbuild-essential-arm64 cryptsetup curl \
            debian-archive-keyring debian-keyring debootstrap device-tree-compiler \
            dialog dirmngr distcc dosfstools dwarves e2fsprogs expect f2fs-tools \
            fakeroot fdisk file flex gawk gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gdisk git gnupg gzip htop imagemagick jq kmod lib32ncurses-dev \
            lib32stdc++6 libbison-dev libc6-dev-armhf-cross libc6-i386 libcrypto++-dev \
            libelf-dev libfdt-dev libfile-fcntllock-perl libfl-dev libfuse-dev \
            libgcc-12-dev-arm64-cross libgmp3-dev liblz4-tool libmpc-dev libncurses-dev \
            libncurses5 libncurses5-dev libncursesw5-dev libpython2.7-dev \
            libpython3-dev libssl-dev libusb-1.0-0-dev linux-base lld llvm locales \
            lsb-release lz4 lzma lzop make mtools ncurses-base ncurses-term \
            nfs-kernel-server ntpdate openssl p7zip p7zip-full parallel parted patch \
            patchutils pbzip2 pigz pixz pkg-config pv python2 python2-dev python3 \
            python3-dev python3-distutils python3-pip python3-setuptools \
            qemu-user-static rar rdfind rename rsync sed \
            squashfs-tools swig tar tree u-boot-tools udev unzip util-linux uuid \
            uuid-dev uuid-runtime vim wget whiptail xfsprogs xsltproc xxd xz-utils \
            zip zlib1g-dev zstd binwalk ripgrep sudo
          df -Th

      - name: Run Build in Ubuntu 22.04
        working-directory: /builder
        run: |
          set -x
          sudo mkdir -p /builder/release/
          sudo /bin/cp -a ${{ github.workspace }}/* .
          WORKDIR=`pwd`
          ls -alh
          cd ${WORKDIR}/u-boot
          sudo ln -svf /usr/bin/python3 /usr/bin/python2
          which python2
          ./kdev-build-uboot.sh
          sudo cp uboot.img /builder/release/
          cd ${WORKDIR}/kernel-6.1
          ./kdev-build-kernel.sh
          sudo cp boot.img resource.img /builder/release/

      - name: List build output
        run: |
          ls -alh  /builder/release/*
          md5sum /builder/release/*

      - name: Upload to Release
        uses: ncipollo/release-action@main
        with:
          tag: g98_android14
          artifacts: /builder/release/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            # 彼度云 G98 Android14

            **测试中，无法引导，不要下载**


            ## 固件下载与刷写指引

            若您的设备已自行焊接 eMMC，并希望以 eMMC 作为启动介质：

            * [EMMC recovery固件刷写指引](https://github.com/yifengyou/BDY_G98_RK3588/blob/master/docs/%E5%88%B7%E6%9C%BA%E6%8C%87%E5%BC%95/emmc_recovery.md)

            ## 免责声明

            - **按原样提供**：本镜像不作任何明示或暗示的保证，使用风险由用户自行承担。
            - **无官方关联**：本项目与 Rockchip、彼度云 任何商业实体无关，为非盈利自由分享。
            - **安全提示**：部署后请及时更新安全补丁、修改默认密码、配置防火墙及访问控制策略。

